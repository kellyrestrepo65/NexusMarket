<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!-- Fragmentos comunes: cabecera, barra superior por rol y mensajes flash -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | NexusMarket'">NexusMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<!-- barra superior: marca, opciones segun el rol, carrito y usuario -->
<header th:fragment="topbar" class="topnav">
    <a th:href="@{/}" class="brand">nexus<span>market</span></a>
    <!-- div y no nav: el selector "nav" de Thymeleaf tambien toma etiquetas <nav> y duplicaba el menu -->
    <div class="top-links" th:if="${currentUser != null}">
        <a th:each="item : ${menu}" th:unless="${item.path() == '/cart'}" th:href="@{${item.path()}}"
           th:classappend="${currentPath == item.path()} ? 'active'" th:text="${item.title()}">Opcion</a>
    </div>
    <div class="top-actions" th:if="${currentUser != null}">
        <a th:each="item : ${menu}" th:if="${item.path() == '/cart'}" th:href="@{/cart}" class="cart-pill"
           th:classappend="${currentPath == '/cart'} ? 'active'">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
            <span th:text="'Carrito · ' + ${cartCount}">Carrito</span>
        </a>
        <div class="user-chip" th:title="${labels.getOrDefault(currentUser.role(), currentUser.role())} + ' · id ' + ${currentUser.id()}">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUser.fullName(), 0, 1))}">U</span>
            <span class="user-info">
                <b th:text="${currentUser.fullName()}">Usuario</b>
                <span th:text="${labels.getOrDefault(currentUser.role(), currentUser.role())}">Rol</span>
            </span>
        </div>
        <form th:action="@{/logout}" method="post" class="inline-action">
            <button type="submit" class="logout" title="Salir" aria-label="Salir">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
            </button>
        </form>
    </div>
</header>

<!-- el menu ahora vive en la barra superior; se deja el fragmento vacio para no romper las vistas -->
<th:block th:fragment="nav"></th:block>

<div th:fragment="alerts">
    <div class="alert ok" th:if="${success}" th:text="${success}">ok</div>
    <div class="alert error" th:if="${error}" th:text="${error}">error</div>
</div>

</body>
</html>
