<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mis productos')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="container">
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="card narrow">
        <h2>Registrar producto</h2>
        <form th:action="@{/products}" method="post" class="form">
            <label>Nombre <input name="name" required></label>
            <div class="row">
                <label>Precio <input name="price" type="number" step="0.01" min="0.01" required></label>
                <label>Tipo
                    <select name="type">
                        <option value="PHYSICAL">Fisico</option>
                        <option value="DIGITAL">Digital</option>
                    </select>
                </label>
            </div>
            <label>Variantes <input name="variants" placeholder="color=rojo, talla=M"></label>
            <button type="submit">Registrar</button>
        </form>
    </section>
    <section class="card">
        <h2>Mis productos</h2>
        <p class="muted" th:if="${#lists.isEmpty(products)}">Aun no tienes productos.</p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(products)}">
            <table>
                <tr><th>Id</th><th>Nombre</th><th>Precio</th><th>Tipo</th><th>Variantes</th><th>Estado</th></tr>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id()}"></td>
                    <td th:text="${p.name()}"></td>
                    <td th:text="${#numbers.formatDecimal(p.price(), 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${labels.getOrDefault(p.type(), p.type())}"></td>
                    <td><div th:each="v : ${p.variants()}" th:text="${v.attribute()} + ': ' + ${v.value()}"></div></td>
                    <td>
                        <form th:action="@{/products/{id}/status(id=${p.id()})}" method="post" class="inline-action">
                            <select name="status">
                                <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s.name() == p.status()}"
                                        th:text="${labels.getOrDefault(s.name(), s.name())}"></option>
                            </select>
                            <button type="submit" class="small ghost">Guardar</button>
                        </form>
                    </td>
                </tr>
            </table>
        </div>
    </section>
</main>
</body>
</html>
